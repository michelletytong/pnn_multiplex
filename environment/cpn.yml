# Environment: cpn  — the pretrained PNN detector
#   s04 --detector lupori only.
#
#   conda env create -f environment/cpn.yml
#   conda activate cpn
#
# This one is awkward and it is not our code: it shells out to predict.py in
# ciampluca/counting_perineuronal_nets, which was written against torch 1.11.
# torch 1.11 needs python 3.8; newer python has no wheel for it.
#
# NOT included, deliberately: torchsort and spacecutter. Their requirements.txt
# lists them, but they are only used by the SCORING model (methods/rank), which this
# pipeline never runs -- we use detection only. torchsort has no wheels and compiles
# from source, which needs Xcode tools on macOS or Visual C++ Build Tools on Windows.
# Leaving it out removes that requirement entirely. If you ever want `predict.py
# --rescore`, add torchsort==0.1.9 and spacecutter==0.2.1 back and expect to compile.
#
# You also need, separately:
#   1. the repo:    git clone https://github.com/ciampluca/counting_perineuronal_nets
#                   and point config.yaml `paths.cpn_repo` at it
#   2. the weights: pnn_v2_fasterrcnn_640.zip from that repo's v0.5 release,
#                   unzipped into model_zoo/   (~330 MB)
#   Check out the repo tag matching your weights: v0.5 for pnn_v2_*, v0.3 for pnn_*.
name: cpn
channels: [conda-forge]
dependencies:
  - python=3.8
  - pip
  - pip:
      - torch==1.11.0
      - torchvision==0.12.0
      - hydra-core==1.1.1
      - omegaconf
      - numpy<2
      - pandas
      - tqdm
      - Pillow==8.4.0
      - scikit-image==0.19.2
      # needed even though we only run DETECTION: their datasets/__init__.py
      # imports the Rank dataset, which imports sklearn, so it loads either way
      - scikit-learn==1.3.2
      - joblib
      - h5py
      - prefetch_generator
      - pyyaml
      - tifffile
